{% extends "base.html" %}
{% block title %}Conferência com reserva{% endblock %}
{% block content %}
<div class="hero-screen">
  <div class="hero-inner" style="grid-template-columns: 1fr;">
    <div class="auth-card" style="max-width:560px;">
      <div class="card-brand">RT</div>
      <p class="card-title">Conferência com reserva</p>
      <p class="card-subtitle">Solicitação {{ numsol }}</p>

      {% if erro %}
        <div class="alert">{{ erro }}</div>
      {% endif %}
      {% if sucesso %}
        <div class="alert" style="background:var(--emerald-soft); border-color:var(--emerald-border);">
          {{ sucesso }}
        </div>
      {% endif %}

      <form method="POST">
        <div class="field">
          <label for="codbar">Código de barras ou produto</label>
          <input type="text" id="codbar" name="codbar" required autofocus>
        </div>
        <div class="field">
          <label for="qtdcon">Quantidade conferida</label>
          <input type="number" id="qtdcon" name="qtdcon" step="any" min="0.01" required>
        </div>
        <div style="display:flex; gap:0.75rem;">
          <a href="{{ url_for('detalhe_solicitacao', codemp=codemp, codfil=codfil, numsol=numsol) }}" class="btn" style="flex:1; justify-content:center;">
            Voltar
          </a>
          <button type="submit" class="btn-primary" style="flex:1; justify-content:center;">Conferir</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
