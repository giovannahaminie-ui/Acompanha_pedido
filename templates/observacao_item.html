{% extends "base.html" %}
{% block title %}Observação do item{% endblock %}
{% block content %}
<div class="login-screen login-centro">

  <div class="login-stage"></div>

  <aside class="login-sidebar" style="--card-w:520px;">
    <div class="login-sidebar-inner">

      <div class="login-card-intro">
        <img class="login-logo-mini" src="{{ url_for('static', filename='img/Tiete 2022 logo nova com qualidae.png') }}" alt="Grupo Tiête">
        <p class="login-title">Observação do item</p>
        <p class="login-subtitle">Solicitação {{ numsol }}</p>
      </div>

      <div class="login-card-form">
        {% if erro %}
          <div class="login-alert">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="8" x2="12" y2="13"></line><line x1="12" y1="16" x2="12" y2="16.01"></line></svg>
            {{ erro }}
          </div>
        {% endif %}

        {% if observacao %}
          <div class="login-field">
            <label>Histórico (não editável)</label>
            <div class="observacao-historico">{{ observacao }}</div>
          </div>
        {% endif %}

        <form method="POST">
          <div class="login-field">
            <label for="observacao">{{ 'Acrescentar comentário' if observacao else 'Observação' }}</label>
            <textarea id="observacao" name="observacao" placeholder="Ex: peça avariada, aguardando substituição..." autofocus></textarea>
          </div>
          <div class="login-botoes">
            <a href="{{ url_for('detalhe_solicitacao', codemp=codemp, codfil=codfil, numsol=numsol) }}" class="login-btn-sec">Cancelar</a>
            <button type="submit" class="login-btn">Salvar</button>
          </div>
        </form>
      </div>

    </div>
  </aside>

</div>
{% endblock %}
