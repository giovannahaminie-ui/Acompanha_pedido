{% extends "base.html" %}
{% block title %}Cancelar item{% endblock %}
{% block content %}
<div class="login-screen login-centro">

  <div class="login-stage"></div>

  <aside class="login-sidebar" style="--card-w:520px;">
    <div class="login-sidebar-inner">

      <div class="login-card-intro">
        <img class="login-logo-mini" src="{{ url_for('static', filename='img/Tiete 2022 logo nova com qualidae.png') }}" alt="Grupo Tiête">
        <p class="login-title">Cancelar item na solicitação</p>
        <p class="login-subtitle">Solicitação {{ numsol }} — produto {{ item.codpro }}</p>
      </div>

      <div class="login-card-form">
        {% if erro %}
          <div class="login-alert">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="8" x2="12" y2="13"></line><line x1="12" y1="16" x2="12" y2="16.01"></line></svg>
            {{ erro }}
          </div>
        {% endif %}

        <div class="login-field">
          <label>Qtd. aberta atualmente (será toda cancelada)</label>
          <input type="text" value="{{ item.qtd_aberta }}" disabled>
        </div>

        <form method="POST">
          <div class="login-field">
            <label for="motivo">Motivo do cancelamento</label>
            <textarea id="motivo" name="motivo" placeholder="Ex: Insira aqui o motivo do cancelamento..." autofocus>{{ motivo or '' }}</textarea>
          </div>
          <div class="login-botoes">
            <a href="{{ url_for('detalhe_solicitacao', codemp=codemp, codfil=codfil, numsol=numsol) }}" class="login-btn-sec">Voltar</a>
            <button type="submit" class="login-btn">Confirmar cancelamento</button>
          </div>
        </form>
      </div>

    </div>
  </aside>

</div>
{% endblock %}
