{% extends "base.html" %}
{% block title %}Cancelar item{% endblock %}
{% block content %}
<div class="hero-screen">
  <div class="hero-inner" style="grid-template-columns: 1fr;">

    <div class="auth-card" style="max-width:520px;">
      <div class="card-brand">RT</div>
      <p class="card-title">Cancelar item na solicitação</p>
      <p class="card-subtitle">
        Solicitação {{ numsol }} — produto {{ item.codpro }}
      </p>

      {% if erro %}
        <div class="alert">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="8" x2="12" y2="13"></line><line x1="12" y1="16" x2="12" y2="16.01"></line></svg>
          {{ erro }}
        </div>
      {% endif %}

      <div class="field">
        <label>Qtd. aberta atualmente (será toda cancelada)</label>
        <input type="text" value="{{ item.qtd_aberta }}" disabled>
      </div>

      <form method="POST">
        <div class="field">
          <label for="motivo">Motivo do cancelamento</label>
          <textarea id="motivo" name="motivo" placeholder="Ex: Insira aqui o motivo do cancelamento..." autofocus>{{ motivo or '' }}</textarea>
        </div>
        <div style="display:flex; gap:0.75rem;">
          <a href="{{ url_for('detalhe_solicitacao', codemp=codemp, codfil=codfil, numsol=numsol) }}" class="btn" style="flex:1; justify-content:center;">
            Voltar
          </a>
          <button type="submit" class="btn-primary" style="flex:1; justify-content:center;">
            Confirmar cancelamento
          </button>
        </div>
      </form>
    </div>

  </div>
</div>
{% endblock %}
