<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Acompanha Pedido{% endblock %} — Retificadora Tiête</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body{% if perfil_logado == 'G' %} class="has-admin-toolbar"{% endif %}>
  <div class="bg-decor" aria-hidden="true"></div>
  {% if perfil_logado == 'G' %}
  <div class="admin-toolbar">
    <div class="admin-dropdown">
      <button type="button" class="admin-shortcut admin-dropdown-trigger" title="Administração">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        Administração
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="admin-dropdown-menu">
        <a href="{{ url_for('admin_perfis') }}">Usuários e perfis</a>
        <a href="{{ url_for('historico_geral') }}">Histórico geral</a>
      </div>
    </div>
  </div>
  {% endif %}
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  {% if perfil_logado == 'G' %}
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const dropdown = document.querySelector('.admin-dropdown');
      const trigger = dropdown.querySelector('.admin-dropdown-trigger');
      trigger.addEventListener('click', function (e) {
        e.stopPropagation();
        dropdown.classList.toggle('open');
      });
      document.addEventListener('click', function () {
        dropdown.classList.remove('open');
      });
    });
  </script>
  {% endif %}
</body>
</html>
