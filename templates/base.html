<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Acompanha Pedido{% endblock %} — Retificadora Tiête</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>if (window.self !== window.top) document.documentElement.classList.add('embed');</script>
</head>
<body>
  <div id="carregando" class="carregando" role="status" aria-live="polite">
    <div class="carregando-anel"></div>
    <span class="carregando-texto">Carregando…</span>
  </div>

  <div class="bg-decor" width="10" height="14" aria-hidden="true"></div>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  {% if request.endpoint != 'painel' %}
  <script>
    // Enter avança pro próximo campo em vez de submeter direto - só faz
    // sentido nas telas de detalhe (inserir peça, conferência etc.), onde
    // a pessoa escaneia código de barras e o leitor já manda um Enter
    // junto. Na tela de acompanhamento (painel/filtros) o Enter tem que
    // buscar direto, então esse script nem carrega lá.
    document.addEventListener('DOMContentLoaded', function () {
      const seletorCampos = 'input:not([type=hidden]):not([type=checkbox]):not([type=radio]):not([disabled]), select:not([disabled]), textarea:not([disabled])';
      document.querySelectorAll('form').forEach(function (form) {
        const campos = Array.prototype.slice.call(form.querySelectorAll(seletorCampos));
        campos.forEach(function (campo, indice) {
          campo.addEventListener('keydown', function (e) {
            if (e.key !== 'Enter' || campo.tagName === 'TEXTAREA') return;
            const proximo = campos[indice + 1];
            if (proximo) {
              e.preventDefault();
              proximo.focus();
              if (typeof proximo.select === 'function') proximo.select();
            }
            // último campo: não intercepta, deixa o Enter submeter o formulário
          });
        });
      });
    });
  </script>
  {% endif %}
  
  {% if nome_usuario_logado %}
  <script>
    //Logout automático por inatividade (5 min sem interação com a tela).
    (function (){
      const LIMITE_INATIVIDADE_MS = 300000;
      let timer;
      function reiniciarTimer() {
        clearTimeout(timer);
        timer = setTimeout(function () {
          window.location.href = "{{ url_for('logout')}}";
        }, LIMITE_INATIVIDADE_MS);
      }
      ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart', 'click'].forEach(function (evento) {
        document.addEventListener(evento, reiniciarTimer, {passive: true});
      });
      reiniciarTimer();
    })();
  </script>
  {% endif %}

  <script>
    // Botão "colar código" - preenche o campo alvo (data-target) com o
    // último código copiado pelos botões do app (guardado em sessionStorage).
    // Em HTTPS tenta ler a área de transferência de verdade primeiro.
    document.addEventListener('click', function (e) {
      var btn = e.target.closest('.btn-colar-codigo');
      if (!btn) return;
      var campo = document.getElementById(btn.dataset.target);
      if (!campo) return;

      function preencher(txt) {
        if (!txt) return;
        campo.value = String(txt).trim().toUpperCase();
        campo.dispatchEvent(new Event('input', { bubbles: true }));
        campo.focus();
      }
      var guardado = null;
      try { guardado = sessionStorage.getItem('ultimoCodigoCopiado'); } catch (err) {}

      if (navigator.clipboard && navigator.clipboard.readText && window.isSecureContext) {
        navigator.clipboard.readText().then(preencher).catch(function () { preencher(guardado); });
      } else {
        preencher(guardado);
      }
    });
  </script>

    <script>
    // Indicador de carregamento global: aparece em qualquer navegação/envio de
    // formulário e some quando a nova página chega (ou ao voltar pelo histórico).
    (function () {
      var overlay = document.getElementById('carregando');
      if (!overlay) return;

      function mostrar() { overlay.classList.add('ativo'); }
      function ocultar() { overlay.classList.remove('ativo'); }
      window.mostrarCarregando = mostrar;
      window.ocultarCarregando = ocultar;

      // Saiu da página (link, clique em linha, form.submit(), redirecionamento):
      // a resposta do servidor pode demorar (webservice), então o ícone fica até a nova tela.
      window.addEventListener('beforeunload', mostrar);

      // Voltou pelo botão "voltar" do navegador (página vinda do cache)
      window.addEventListener('pageshow', function (e) { if (e.persisted) ocultar(); });

      // Formulário enviado para um iframe (pop-up de Pedir na loja/Solicitar compra):
      // a página atual não descarrega, então mostra aqui e esconde quando o iframe carregar.
      document.addEventListener('submit', function (e) {
        var form = e.target;
        if (e.defaultPrevented || !form.tagName || form.tagName !== 'FORM') return;
        if (form.hasAttribute('data-sem-loading')) return;
        var alvo = (form.getAttribute('target') || '').toLowerCase();
        if (alvo === '' || alvo === '_self' || alvo === '_top' || alvo === '_parent' || alvo === '_blank') return;
        mostrar();
      });
      document.addEventListener('load', function (e) {
        if (e.target && e.target.tagName === 'IFRAME') ocultar();
      }, true);
    })();
  </script>
  
</body>
</html>
